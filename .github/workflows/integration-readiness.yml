###############################################################################
# Integration Readiness CI — Desideriushogeschool Event Platform
#
# PURPOSE:
#   This central hub checks out all service repositories in the organization
#   to validate cross-team XML/XSD compatibility.
###############################################################################

name: "🔗 Integration Readiness"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-integration-tests]

jobs:
  integration-tests:
    name: "Integration Contract Tests"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout integration-tests (Self)
        uses: actions/checkout@v4
        with:
          path: integration-tests

      - name: Checkout organization repositories
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_ORG: IntegrationProject-Groep1
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          org = os.environ["GITHUB_ORG"]
          token = os.environ["PAT_TOKEN"]
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          seen: set[str] = set()
          page = 1

          while True:
              url = (
                  f"https://api.github.com/orgs/{urllib.parse.quote(org)}/repos"
                  f"?per_page=100&page={page}&type=all&sort=full_name"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  repos = json.load(response)

              if not repos:
                  break

              for repo in repos:
                  repo_name = str(repo["name"])
                  if repo_name == "integration-tests" or repo_name in seen:
                      continue

                  seen.add(repo_name)
                  target = workspace / repo_name
                  clone_url = f"https://github.com/{org}/{repo_name}.git"
                  subprocess.run(
                      [
                          "git",
                          "-c",
                          f"http.https://github.com/.extraheader=AUTHORIZATION: bearer {token}",
                          "clone",
                          "--depth",
                          "1",
                          clone_url,
                          str(target),
                      ],
                      check=True,
                  )

              page += 1
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml
          pip install -r identity-service/requirements.txt

      - name: Run integration contract tests
        run: |
          # The workspace root now contains all the service folders as siblings to integration-tests
          export INTEGRATION_REPO_ROOT=$GITHUB_WORKSPACE
          cd integration-tests
          python -m pytest -v --tb=short --no-header 2>&1 | tee test-output.txt

      - name: Generate readiness report
        if: always()
        run: |
          cd integration-tests
          python generate_report.py

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-readiness-report
          path: integration-tests/readiness-report.md

      - name: Post summary to GitHub
        if: always()
        run: |
          if [ -f integration-tests/readiness-report.md ]; then
            cat integration-tests/readiness-report.md >> $GITHUB_STEP_SUMMARY
          fi
