###############################################################################
# Integration Readiness CI — Desideriushogeschool Event Platform
#
# PURPOSE:
#   This central hub checks out all service repositories in the organization
#   to validate cross-team XML/XSD compatibility.
###############################################################################

name: "🔗 Integration Readiness"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-integration-tests]

jobs:
  integration-tests:
    name: "Integration Contract Tests"
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout integration-tests (Self)
        uses: actions/checkout@v4
        with:
          path: integration-tests

      - name: Checkout Frontend
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/IP-groep1-frontend
          path: IP-groep1-frontend
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout CRM
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/CRM
          path: CRM
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Kassa
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/Kassa
          path: Kassa
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Planning
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/Planning
          path: Planning
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Facturatie
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/Facturatie
          path: Facturatie
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Mailing
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/Mailing
          path: Mailing
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Monitoring
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/monitoring
          path: monitoring
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Heartbeat
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/heartbeat
          path: heartbeat
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Identity Service
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/identity-service
          path: identity-service
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Infra
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/Infra
          path: Infra
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout XML/XSD Contract
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: IntegrationProject-Groep1/xml-xsd-contract
          path: xml-xsd-contract
          token: ${{ secrets.PAT_TOKEN }}

      - name: Debug - List checked out directories
        run: |
          echo "=== Workspace structure ==="
          ls -la ${{ github.workspace }} | head -20
          echo ""
          echo "=== Integration-tests directory ==="
          ls -la integration-tests/ | head -20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml pytest pika
          pip install -r identity-service/requirements.txt 2>/dev/null || echo "Note: identity-service/requirements.txt not found, continuing"

      - name: Run integration contract tests
        run: |
          export INTEGRATION_REPO_ROOT=${{ github.workspace }}
          cd integration-tests
          python -m pytest -v --tb=short --no-header --junitxml=pytest_junit.xml 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Generate readiness report
        if: always()
        env:
          READINESS_USE_EXISTING_JUNIT: "1"
        run: |
          cd integration-tests
          python generate_report.py
        continue-on-error: true

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-readiness-report
          path: integration-tests/readiness-report.md
        continue-on-error: true

      - name: Post summary to GitHub
        if: always()
        run: |
          if [ -f integration-tests/readiness-report.md ]; then
            echo "## 🔗 Integration Readiness" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat integration-tests/readiness-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Readiness report not generated" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  e2e-tests:
    name: "E2E Tests (manual)"
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'workflow_dispatch'
    env:
      COMPOSE_SEARCH_MAX_DEPTH: "3"
    steps:
      - name: Checkout all repos
        uses: actions/checkout@v4
        with:
          path: integration-tests

      - name: Checkout additional repositories
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/CRM
          path: CRM
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Docker Compose
        run: |
          sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Resolve Docker Compose file
        run: |
          COMPOSE_FILE=""
          for CANDIDATE in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            MATCH=$(find CRM -maxdepth "$COMPOSE_SEARCH_MAX_DEPTH" -type f -name "$CANDIDATE" | sort | head -n 1)
            if [ -n "$MATCH" ]; then
              COMPOSE_FILE="$MATCH"
              break
            fi
          done
          if [ -z "$COMPOSE_FILE" ]; then
            echo "No Docker Compose file found in CRM checkout"
            if [ -d CRM ]; then
              ls -la CRM
            else
              echo "CRM checkout directory is missing"
            fi
            exit 1
          fi
          echo "Using compose file: $COMPOSE_FILE"
          {
            echo "COMPOSE_FILE<<EOF"
            echo "$COMPOSE_FILE"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Ensure CRM env file exists
        run: |
          COMPOSE_DIR="$(dirname "$COMPOSE_FILE")"
          ENV_FILE="$COMPOSE_DIR/.env"
          if [ -f "$ENV_FILE" ]; then
            echo "Using existing env file: $ENV_FILE"
          elif [ -f "$COMPOSE_DIR/.env.example" ]; then
            cp "$COMPOSE_DIR/.env.example" "$ENV_FILE"
            echo "Created env file from .env.example: $ENV_FILE"
          elif [ -f "$COMPOSE_DIR/.env.template" ]; then
            cp "$COMPOSE_DIR/.env.template" "$ENV_FILE"
            echo "Created env file from .env.template: $ENV_FILE"
          else
            touch "$ENV_FILE"
            echo "Created empty env file: $ENV_FILE"
          fi

      - name: Start full stack
        run: |
          docker-compose -f "$COMPOSE_FILE" up -d

      - name: Wait for services
        run: |
          sleep 20

      - name: Run gated E2E tests
        run: |
          cd integration-tests
          export RUN_E2E=1
          python -m pytest -v -k e2e --junitxml=pytest_junit_e2e.xml

      - name: Upload E2E junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-junit
          path: integration-tests/pytest_junit_e2e.xml

      - name: Teardown stack
        if: always()
        run: |
          TEARDOWN_COMPOSE_FILE="${COMPOSE_FILE:-}"
          if [ -z "$TEARDOWN_COMPOSE_FILE" ] || [ ! -f "$TEARDOWN_COMPOSE_FILE" ]; then
            for CANDIDATE in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
              MATCH=$(find CRM -maxdepth "$COMPOSE_SEARCH_MAX_DEPTH" -type f -name "$CANDIDATE" | sort | head -n 1)
              if [ -n "$MATCH" ]; then
                TEARDOWN_COMPOSE_FILE="$MATCH"
                break
              fi
            done
          fi
          if [ -n "$TEARDOWN_COMPOSE_FILE" ] && [ -f "$TEARDOWN_COMPOSE_FILE" ]; then
            echo "Using compose file for teardown: $TEARDOWN_COMPOSE_FILE"
            docker-compose -f "$TEARDOWN_COMPOSE_FILE" down
          elif [ -d CRM ]; then
            echo "Compose file not found during teardown; showing CRM directory"
            ls -la CRM
          else
            echo "Compose file not found during teardown and CRM directory is missing; skipping docker-compose down"
          fi
