###############################################################################
# Integration Readiness CI — Desideriushogeschool Event Platform
#
# PURPOSE:
#   This central hub checks out all service repositories in the organization
#   to validate cross-team XML/XSD compatibility.
###############################################################################

name: "🔗 Integration Readiness"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-integration-tests]

jobs:
  integration-tests:
    name: "Integration Contract Tests"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout integration-tests (Self)
        uses: actions/checkout@v4
        with:
          path: integration-tests

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/IP-groep1-frontend
          path: IP-groep1-frontend
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout CRM
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/CRM
          path: CRM
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Kassa
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Kassa
          path: Kassa
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Planning
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Planning
          path: Planning
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Facturatie
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Facturatie
          path: Facturatie
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Mailing
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Mailing
          path: Mailing
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Monitoring
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/monitoring
          path: monitoring
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Heartbeat
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/heartbeat
          path: heartbeat
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Identity Service
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/identity-service
          path: identity-service
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Infra
        uses: actions/checkout@v4
        with:
          repository: IntegrationProject-Groep1/Infra
          path: Infra
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml
          pip install -r identity-service/requirements.txt

      - name: Run integration contract tests
        run: |
          # The workspace root now contains all the service folders as siblings to integration-tests
          export INTEGRATION_REPO_ROOT=$GITHUB_WORKSPACE
          cd integration-tests
          python -m pytest -v --tb=short --no-header 2>&1 | tee test-output.txt

      - name: Generate readiness report
        if: always()
        run: |
          cd integration-tests
          python generate_report.py

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-readiness-report
          path: integration-tests/readiness-report.md

      - name: Post summary to GitHub
        if: always()
        run: |
          if [ -f integration-tests/readiness-report.md ]; then
            cat integration-tests/readiness-report.md >> $GITHUB_STEP_SUMMARY
          fi
