name: "🔗 Integration Readiness"

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  integration-tests:
    name: "Integration Contract Tests"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lxml pytest pytest-md

      - name: Run integration contract tests
        run: |
          python -m pytest test_contracts.py test_dod_checks.py -v --tb=short --no-header 2>&1 | tee test-output.txt

      - name: Generate readiness report
        if: always()
        run: python generate_report.py

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-readiness-report
          path: readiness-report.md

      - name: Post summary to GitHub
        if: always()
        run: |
          if [ -f readiness-report.md ]; then
            cat readiness-report.md >> $GITHUB_STEP_SUMMARY
          fi
